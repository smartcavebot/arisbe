name: Canonical Pipeline CI

on:
  push:
    branches: [ main, master, "release/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js (for ELK layout worker)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # This is the same environment-construction command documented for users.
      # CI must not carry private uv/npm setup knowledge that can mask a broken
      # clean install. --ci additionally installs Chromium and proves a real SVG
      # render through the browser, retaining a screenshot and JSON receipt.
      - name: Bootstrap and prove deployment
        run: python tools/bootstrap.py --ci

      - name: Run full test suite
        run: uv run pytest tests/ -q

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification
          path: build/deployment-artifacts/
          if-no-files-found: warn
